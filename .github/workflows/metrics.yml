name: GitHub Metrics

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: copperlamb78

          template: classic
          base: header, activity, community, repositories, metadata
          filename: github-metrics.svg
          config_timezone: America/Bahia

          plugins_errors_fatal: no

          config_order: base.header, isocalendar, languages, repositories

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          # "atividade recente" e "linhas" saíram em 27/11/2026: alongavam o painel
          # sem dizer nada que o resto do perfil não diga. "Hábitos" saiu junto:
          # aparecia no perfil como "Unexpected error".
          plugin_repositories: yes
          plugin_repositories_featured: copperlamb78/vitrimini, copperlamb78/copperlamb78
