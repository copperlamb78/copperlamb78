name: generate animation

on:
  # executa automaticamente a cada 24 horas
  schedule:
    - cron: "0 */24 * * *"

  # permite rodar manualmente no GitHub Actions
  workflow_dispatch:

  # executa a cada push na branch principal
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # gera a cobrinha nas cores do banner (slate -> teal -> sky)
      # color_dots: 1o = sem contribuicao, depois do menor ao maior (5 cores)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0ea5e9&color_dots=#e2e8f0,#99f6e4,#2dd4bf,#0d9488,#0f766e&color_dot_border=#00000010
            dist/github-contribution-grid-snake-dark.svg?color_snake=#38bdf8&color_dots=#0f172a,#134e4a,#0f766e,#14b8a6,#5eead4&color_dot_border=#ffffff10

      # envia os arquivos gerados para a branch output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
